<div id="broadcast-transmission-settings"></div>

<div class="card">
  <label class="field-label" for="broadcast-message">Texte de la transmission</label>
  <textarea id="broadcast-message" maxlength="2000" rows="8" spellcheck="true" placeholder="M.I.A.O. // TRANSMISSION DE BORD&#10;Écris ici le message adapté à ton stream…"></textarea>
  <div class="meta">
    <span id="broadcast-stats" class="stats">0 ligne · 0 caractère</span>
    <span>Conseil : 6 lignes / 260 caractères</span>
  </div>
  <div class="actions">
    <button id="broadcast-save-message" type="button" class="action primary">Synchroniser</button>
    <button id="broadcast-reload" type="button" class="action">Recharger</button>
  </div>
</div>

<p class="help">Si les deux pages sont désactivées, le widget devient entièrement transparent. Si une seule page est active, elle reste affichée sans être retapée en boucle.</p>
